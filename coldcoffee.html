</html><!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fresh Juices | Annapurna Cold Drink Shop</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
background:#08141f;
font-family:Poppins,sans-serif;
color:#fff;
}

.sub-header{
    position: relative;
    width:100%;
padding:40px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);

}

.back-btn{
padding:12px 25px;
background:#ff9800;
color:#fff;
border-radius:30px;
text-decoration:none;
font-weight:600;
}

.sub-title{
text-align:center;
padding:60px 20px 30px;
}

.sub-title h1{
font-size:50px;
color:#ffb347;
}

.products{
width:90%;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding-bottom:80px;
}

.product{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:25px;
padding:25px;
text-align:center;
transition:.4s;
}

.product:hover{
transform:translateY(-10px);
}

.product img{
width:180px;
height:220px;
object-fit:contain;
margin:auto;
}

.product h2{
margin-top:15px;
}

.size{
color:#ffb347;
font-weight:600;
margin:10px 0;
}

.price{
font-size:28px;
color:#ff9800;
font-weight:bold;
margin:15px 0;
}

.buy{
background:#ff9800;
padding:12px 30px;
border:none;
border-radius:30px;
color:white;
cursor:pointer;
font-size:16px;
transition:.3s;
}

.buy:hover{
background:#ffb347;
}

</style>

</head>

<body>



<script>

const buttons=document.querySelectorAll(".buy");

buttons.forEach(btn=>{

btn.onclick=()=>{

alert("Juice Added to Cart Successfully!");

}

});

</script>

</body>

</html>
