<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Annapurna Cold Drink Shop</title>

    <link rel="stylesheet" href="menu1.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <div class="overlay"></div>

    <!-- Floating Bubbles -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <header class="navbar">

        <div class="logo">

            <img src="images/logo.png" alt="Logo">

            <div class="logo-text">

                <h2>Annapurna</h2>

                <p>Cold Drink Shop</p>

            </div>

        </div>

        <button class="menu-btn" aria-label="Toggle menu"><i class="fa fa-bars"></i></button>

        <nav>

            <ul class="nav-links">

                <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a></li>

                <li><a href="index.html#menu"><i class="fa-solid fa-list"></i><span>Menu</span></a></li>

                <li><a href="index.html#special"><i class="fa-solid fa-star"></i><span>Specials</span></a></li>

                <li><a href="index.html#about"><i class="fa-solid fa-circle-info"></i><span>About</span></a></li>

                <li><a href="index.html#gallery"><i class="fa-solid fa-image"></i><span>Gallery</span></a></li>

                <li><a href="index.html#contact"><i class="fa-solid fa-phone"></i><span>Contact</span></a></li>

            </ul>

        </nav>

        <div class="nav-icons">

            <i class="fa-solid fa-magnifying-glass"></i>

            <i class="fa-solid fa-cart-shopping"></i>

        </div>

    </header>

    

    <!-- ==========================
            PRODUCTS
    =========================== -->

    <section class="products-section">

        <div class="heading">

            <h3>Our Specialties</h3>

            <h1>Cold Coffee</h1>

            <p>Signature blends brewed to perfection and chilled cold</p>

        </div>

        <div class="container">

            <div class="card">

                <div class="card-image">

                    <img src="images/coffee.jpeg" alt="Cold Coffee">

                </div>

                <div class="card-content">

                    <h3>Classic Cold Coffee</h3>

                    <div class="rating">
                        ★★★★★
                    </div>

                    <p>
                        Rich roasted espresso blended with creamy milk and ice.
                    </p>

                    <div class="price-row">

                        <span class="price">₹60</span>

                        <button class="buy-btn">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>


        </div>

    </section>

    <script src="script.js"></script>
</body>

</html>
