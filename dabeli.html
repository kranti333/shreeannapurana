<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Annapurna Cold Drink Shop</title>

    <link rel="stylesheet" href="menu1.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <div class="overlay"></div>

    <!-- Floating Bubbles -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <header class="navbar">

        <div class="logo">

            <img src="images/logo.jpeg" alt="Logo">

            <div class="logo-text">

                <h2>shree Annapurna</h2>

                <p>Cold Drink Shop</p>

            </div>

        </div>

        <button class="menu-btn" aria-label="Toggle menu"><i class="fa fa-bars"></i></button>

        <nav>

            <ul class="nav-links">

                <li><a href="#" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a></li>

                <li><a href="#menu"><i class="fa-solid fa-list"></i><span>Menu</span></a></li>

                <li><a href="#special"><i class="fa-solid fa-star"></i><span>Specials</span></a></li>

                <li><a href="#about"><i class="fa-solid fa-circle-info"></i><span>About</span></a></li>

                <li><a href="#gallery"><i class="fa-solid fa-image"></i><span>Gallery</span></a></li>

                <li><a href="#contact"><i class="fa-solid fa-phone"></i><span>Contact</span></a></li>

            </ul>

        </nav>

        <div class="nav-icons">

            <i class="fa-solid fa-magnifying-glass"></i>

            <i class="fa-solid fa-cart-shopping"></i>

        </div>

    </header>
    

    <!-- ==========================
            MENU
    =========================== -->

    <section id="menu" class="menu-section">

        <div class="section-heading">

            <h2>Dabeli & Bhel</h2>

            <p>

                Fresh • Chilled • Delicious

            </p>

        </div>

         <div class="menu-grid">

            <!-- Cheese Dabeli---->

            <div class="card">

                <div class="card-image">

                    <img src="images/dabeli.jpeg" alt="Cold Drinks">

                </div>

                <div class="card-content">

                    <h3> Cheese Dabeli</h3>


                    <div class="price-row">

                        <span>₹70</span>

                        <button>

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>

                    </div>

                </div>

            </div>

            <!--dabeli-->

            <div class="card">

                <div class="card-image">

                    <img src="images/dabelis.jpg" alt="Juices">

                </div>

                <div class="card-content">

                    <h3>Dabeli</h3>
					

                    <div class="price-row">

                        <span>₹50</span>

                        <button>

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>

                    </div>

                </div>

            </div>

            
			            <!--special Bhel-->

            <div class="card">

                <div class="card-image">

                    <img src="images/bhel.jpg" alt="Ice Cream">

                </div>

                <div class="card-content">

                    <h3>special Bhel</h3>

                  

                    <div class="price-row">

                        <span>₹50</span>

                        <button>

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>

                    </div>

                </div>

            </div>

            <!--Misal-->

            <div class="card">

                <div class="card-image">

                    <img src="images/misal.jpg" alt="Mocktails">

                </div>

                <div class="card-content">

                    <h3>Misal</h3>


                    <div class="price-row">

                        <span>₹70</span>

                        <button>

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>

                    </div>

                </div>

            </div>

           
			
			
			
			

        </div>

    </section>


    

</body>

</html>
